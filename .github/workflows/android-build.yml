name: Android APK (ARM 32-bit + 64-bit)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Checks and Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Generate Android native project
        env:
          CI: '1'
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify both ARM ABIs are packaged
        shell: bash
        run: |
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          entries="$(unzip -Z1 "$apk")"
          for abi in armeabi-v7a arm64-v8a; do
            if ! grep -Eq "^lib/${abi}/.+\\.so$" <<< "$entries"; then
              echo "ERROR: APK is missing native libraries for ${abi}."
              exit 1
            fi
            echo "Verified native libraries for ${abi}."
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaFlix-Android-ARMv7-ARM64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
